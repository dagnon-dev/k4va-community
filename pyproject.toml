[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4va-community"
version = "0.1.0"
description = "Local OpenAPI governance and production-readiness analyzer"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
k4va = "k4va.cli:main"

[tool.setuptools.packages.find]
include = ["k4va*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
